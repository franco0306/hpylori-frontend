<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- Ancho real del dispositivo. Con `width=1280` el móvil simulaba una
       pantalla de escritorio y la interfaz salía diminuta y recortada. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EndoScan AI · Detección de H. pylori</title>
  

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Aplica el tema guardado antes de pintar (evita el destello de blanco al
       abrir la app en una sala de endoscopia a oscuras). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("endoscan.theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- React UMD (producción ligera vía CDN). Reemplaza por tu propia copia si despliegas offline. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Bloquea drag & drop fuera de las dropzones (UX) -->
  <script>
    window.addEventListener("dragover", function (e) {
      if (!e.target.closest || !e.target.closest("[data-dropzone]")) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = "none";
      }
    }, false);
    window.addEventListener("drop", function (e) {
      if (!e.target.closest || !e.target.closest("[data-dropzone]")) {
        e.preventDefault();
      }
    }, false);
  </script>

  <!-- App como módulo ES. Sirve los archivos vía un servidor HTTP (no funciona con file://). -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
